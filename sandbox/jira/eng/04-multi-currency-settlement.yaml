  - key: ENG-183
    type: Bug
    summary: "Monthly charge on the EUR account raised LDG-4102 instead of a fee journal"
    status: Done
    priority: Low
    labels: [payments]
    description: |
      **Steps to reproduce.** Run `recon-daily` for the first business day of the month,
      when the bank's monthly charge appears on our EUR account statement.

      **Expected.** The line is recognised by its fee narrative and a fee journal is
      posted to the bank charges account, as for GBP.

      **Actual.** The fee matcher knew only the GBP narrative, so the EUR charge raised
      `LDG-4102 MISSING_SETTLEMENT_LINE`. The run cleared it as under £5, but it should
      never have been a break.

      **Fix.** Fee narratives are configured per account and currency.
    comments:
      - "Kwabena: Fixed, and the EUR narrative is in the matcher's tests."
