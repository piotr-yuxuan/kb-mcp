  - key: ENG-731
    type: Task
    summary: "List which data quality alerts page the data on-call out of hours"
    status: Done
    priority: Low
    labels: [data]
    description: |
      Update [Data platform on-call](../../corpus/data/data-on-call.md) so that the
      on-call knows what can wait:

      | Event | Pages out of hours? |
      |---|---|
      | `DQ-017` on a tier 1 table | Yes |
      | `DQ-044` holding a tier 1 pipeline | Yes |
      | `DQ-031` warning on any table | No: next working day |
      | Anything on a tier 2 table | No: owning team, working hours |

