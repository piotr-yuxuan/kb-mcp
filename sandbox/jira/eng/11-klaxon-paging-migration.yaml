  - key: ENG-459
    type: Task
    summary: Switch off the old paging service
    status: Done
    priority: Medium
    labels: [sre]
    description: |
      With every rota and alert route on Klaxon, switch the old paging service off:

      1. confirm for a full week that no alert still points at it;
      2. export its page history for the records and attach it to this ticket;
      3. switch it off and remove its credentials from Strongroom;
      4. remove it from the incident policy and from team pages.

      After this, Klaxon is the only thing that pages.
    comments:
