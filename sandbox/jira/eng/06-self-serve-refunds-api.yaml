    summary: "Check every pilot refund against the ledger before general availability"
    status: Done
    priority: Medium
    labels: [payments]
    description: |
      Before refunds open to every merchant, confirm that the pilot left the books
      clean. For every refund the twenty pilot merchants made:

      - its journals balance, and a failed refund has its reversing entry;
      - no payment was refunded beyond its captured amount;
      - no refund was paid twice;
      - every refund over £10,000 went through T2 approval.

      ```sql
      SELECT payment_id, SUM(amount_minor) AS refunded, MAX(captured_minor) AS captured
      FROM ledger.refunds
      WHERE merchant_id = ANY(:pilot_merchants)
      GROUP BY payment_id
      HAVING SUM(amount_minor) > MAX(captured_minor);
      ```
