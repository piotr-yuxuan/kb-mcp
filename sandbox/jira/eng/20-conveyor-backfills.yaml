  - key: ENG-809
    type: Bug
    summary: "Expected end time ignores the overnight suspension of a backfill"
    status: To Do
    priority: Medium
    labels: [data, follow-up]
    description: |
      **Steps to reproduce:** start a backfill at 20:00 UTC whose estimated runtime is six
      hours, and run `conveyor backfill status` on it.

      **Expected:** an end time after 06:00 UTC the next morning, since the backfill will
      be suspended from 00:00 to 06:00 UTC.

      **Actual:** the status promises an end at about 02:00 UTC, as though the nightly
      window did not exist.

      **Fix:** add the suspension to the estimate whenever the remaining partitions run
      past midnight.
