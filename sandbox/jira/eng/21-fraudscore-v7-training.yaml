      ```python
      booster = lgb.Booster(model_file="trees.txt")
      gains = booster.feature_importance(importance_type="gain")
      top = sorted(zip(booster.feature_name(), gains), key=lambda pair: pair[1], reverse=True)[:20]
      ```

