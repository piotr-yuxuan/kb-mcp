  - key: ENG-690
    type: Story
    summary: "Move the merchant_orders_daily run to 01:30 UTC"
    status: Done
    priority: High
    labels: [data]
    description: |
      As Finance, I want the table ready hours before the 06:00 UTC deadline, with time to
      retry a failed run.

      The old query started at 04:00 UTC. The parallel run showed that the night's
      ingestion is reliably committed by 01:30 UTC and that the new pipeline takes 50 to
      60 minutes.

      ```python
      schedule=daily(at="01:30")  # UTC
      ```

      Acceptance criteria:

      - the rebuilt pipeline writes `marts.merchant_orders_daily` from 01:30 UTC;
      - a normal night has the table ready by about 02:30 UTC, three and a half hours
        before the deadline;
      - the freshness deadline stays at 06:00 UTC.

      See [Pipeline: merchant_orders_daily](../../corpus/data/merchant-orders-daily.md).
    comments:
      - "Tomasz: Approved. The deadline and the tier are unchanged."
      - "Rafael: The first nights at 01:30 UTC all published before 02:45 UTC."
