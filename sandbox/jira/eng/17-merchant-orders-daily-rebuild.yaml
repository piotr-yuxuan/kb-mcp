  - key: ENG-687
    type: Bug
    summary: "A duplicated capture event pushes the ledger agreement check over 0.1%"
    status: Done
    priority: Highest
    labels: [data]
    description: |
      **Steps to reproduce.** Rebuild, in the parallel run, the day on which the ledger
      load restarted mid-batch.

      **Expected.** GBP captures agree with the ledger within 0.1%.

      **Actual.** The ledger agreement test failed: one capture event had reached `raw`
      twice when the loader resent a batch, and `stg_ledger__captures` kept both copies.

      **Fix.** `stg_ledger__captures` deduplicates on the capture's event identifier,
      keeping the earliest load. The check did its job: the table was held back and no
      wrong figure reached Finance.
    comments:
      - "Kwabena: Confirmed on our side; the ledger has a single journal for that capture."
      - "Signe: The loader is at-least-once by design, so staging is the right place to deduplicate."
