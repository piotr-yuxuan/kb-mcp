  - key: ENG-1079
    type: Story
    summary: Set the priority from the merchant's urgency answer on the contact form
    status: Won't Do
    priority: Low
    labels: [support]
    description: |
      As a T1 agent, I would like Harbour to set the priority from the urgency the
      merchant chooses on the contact form in Merchant Hub, so that urgent tickets do
      not wait at the default P3.

      Acceptance criteria:

      - Each answer on the contact form maps to a priority from P1 to P4.
      - Agents can change the priority afterwards.
      - A mapped P1 pages the payments on-call like any other.
    comments:
      - "Dorian: Most merchants pick the most urgent option whatever the problem. Mapping it to P1 would page the on-call for how-to questions."
      - "Femi: Won't Do. Agents set the priority. Harbour keeps showing the merchant's answer on the ticket, which is enough to triage it first."
  - key: ENG-1080
    type: Bug
    summary: Reopened tickets keep their original first-response target
    status: Done
    priority: Medium
    labels: [support]
    description: |
      **Steps to reproduce**

      1. Solve a P3 ticket.
      2. Three days later the merchant replies, and the ticket reopens.

      **Expected:** a new first-response target at the ticket's current priority,
      counted from the reopening.

      **Actual:** the ticket keeps its original target, long passed, turns red at once
      and counts as a breach in the weekly report.

      **Fix:** reopening sets a new target, and the weekly report counts the reply to a
      reopened ticket as a new first response.
  - key: ENG-1081
    type: Task
    summary: Review the P1 pages sent during the peak trading freeze
    status: Done
    priority: Medium
    labels: [support, follow-up]
    description: |
      The peak trading freeze ran from 24 November to 2 December, the first peak with
      P1 paging on every queue. Review every page Harbour sent over the period:

      - time from ticket creation to P1, and from P1 to the on-call's acknowledgement;
      - P1 tickets that turned out to be the merchant's own configuration;
      - tickets that should have been P1 and sat at the default P3.

      ```sql
      select ticket_id, queue, created_at, p1_set_at, page_acknowledged_at
      from harbour.p1_pages
      where p1_set_at between '2025-11-24' and '2025-12-03'
      order by p1_set_at;
      ```

      Bring the findings to the support weekly review.
    comments:
      - "Femi: Every page was acknowledged quickly. Two tickets sat at the default P3 for too long before triage; the morning shift now triages general from the oldest ticket first."
