  - key: ENG-224
    type: Bug
    summary: "Conversion preview kept an expired quote after the browser tab was hidden"
    status: Done
    priority: Low
    labels: [payments]
    description: |
      **Steps to reproduce.** In Merchant Hub on staging, open a payout with a
      conversion preview, switch to another browser tab for a minute, then come back.

      **Expected.** The preview shows a valid quote.

      **Actual.** Browsers slow timers in hidden tabs, so the refresh never fired and
      the preview showed a quote that had expired.

      **Fix.** When the tab becomes visible again, Hub compares `expires_at` with the
      current time and fetches a new quote if needed.
  - key: ENG-225
    type: Story
    summary: "Show live conversion previews in Merchant Hub"
    status: Done
    priority: Medium
    labels: [payments]
    description: |
      As a merchant whose payout or settlement involves a currency conversion, I want
      to see the rate before it happens.

      Acceptance criteria:

      - Merchant Hub shows the rate, the time the quote was issued and how long it
        remains valid.
      - When the quote expires, Hub fetches a new one automatically.
      - The preview uses the rewritten `fx-quote` through the Merchant API.
      - Released to every merchant in May, with an entry in
        [Merchant Hub release notes 2026](../../corpus/product/merchant-hub-release-notes-2026.md).
