# Golden questions for evaluating search over the sandbox corpus (plan 002).
#
# Each question names documents by key: a page as <section>/<name>, a ticket as
# ENG-n, an idea as jira/<name>.
# - overlap: how the question's words relate to its answers' wording: identifier
#   (it quotes a code or name), keyword (it shares ordinary words), paraphrase (it
#   shares no word of four letters or more with their titles and headings).
# - lang: the question's language, en or fr.
# - expected: the documents that answer it, relevance 2; two when it needs a
#   second hop. partial: documents that help, relevance 1.
# - evidence: for each expected document, 3 to 12 consecutive words of its plain
#   text that state the answer; absent from the question, the distractors and
#   the outdated documents.
# - outdated: superseded documents that hold an older answer.
# - traps: what the question tests, from a closed list: synonym, acronym,
#   identifier, near-duplicate, outdated, cross-link, cross-lingual.
# - distractors: look-alike documents that do not answer it.

