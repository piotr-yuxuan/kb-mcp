[project]
name = "kb-mcp"
version = "0.1.0"
description = "Knowledge base MCP: an offline mirror of Confluence and Jira Cloud, served to coding agents over MCP."
readme = "README.md"
requires-python = ">=3.14"
# Declared together for plans 004 to 006, so that their parallel branches never
# conflict over this file or the lock.
dependencies = [
  "argcomplete>=3.7,<4",
  "certifi>=2024.2",
  "httpx>=0.28,<1",
  "lxml>=6,<7",
  "mcp>=2.3,<3",
  "numpy>=2.3,<3",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-logging>=0.66b1,<1",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-semantic-conventions>=0.66b1,<1",
  "pillow>=13,<14",
  "platformdirs>=4.13,<5",
  "playwright>=1.64,<2",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.15,<3",
  "pyyaml>=6,<7",
  "requests>=2.34,<3",
  "rich>=15,<16",
  "structlog>=26.1,<27",
  "truststore>=0.10,<1",
]

[project.scripts]
kb-mcp = "kb_mcp.cli.main:main"

[dependency-groups]
dev = [
  "import-linter>=2.15,<3",
  "markdown-it-py>=4,<5",
  "opentelemetry-proto>=1.45,<2",
  "pytest>=9,<10",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.16,<0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]

[tool.importlinter]
root_package = "kb_mcp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contexts use those below them, never those above"
type = "layers"
containers = ["kb_mcp"]
layers = [
  "cli",
  "evaluation",
  "mcp",
  "search",
  "mirror",
  "sources",
  "config",
  "observability",
  "kernel",
]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
name = "Within each context: entry, commands, options, use cases, effects, pure rules"
type = "layers"
containers = [
  "kb_mcp.cli",
  "kb_mcp.evaluation",
  "kb_mcp.mcp",
  "kb_mcp.search",
  "kb_mcp.mirror",
  "kb_mcp.sources.*",
  "kb_mcp.config",
  "kb_mcp.observability",
]
layers = ["(main)", "(commands)", "(options)", "(app)", "(adapters)", "(domain)"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Pure rules, in any context, use no effect and no use case"
type = "forbidden"
source_modules = ["kb_mcp.kernel", "kb_mcp.**.domain"]
forbidden_modules = [
  "kb_mcp.**.adapters",
  "kb_mcp.**.app",
  "opentelemetry",
  "rich",
  "structlog",
]

[[tool.importlinter.contracts]]
name = "Effects, in any context, use no use case"
type = "forbidden"
source_modules = ["kb_mcp.**.adapters"]
forbidden_modules = ["kb_mcp.**.app"]

[[tool.importlinter.contracts]]
name = "Search, the server and the evaluation read the mirror, never a source"
type = "forbidden"
source_modules = [
  "kb_mcp.search",
  "kb_mcp.mcp",
  "kb_mcp.evaluation",
  "kb_mcp.cli.commands.serve",
  "kb_mcp.cli.commands.index",
  "kb_mcp.cli.commands.evaluate",
  "kb_mcp.cli.commands.model",
]
forbidden_modules = ["kb_mcp.sources"]

[[tool.importlinter.contracts]]
name = "Use cases and commands reach the network through effects only"
type = "forbidden"
source_modules = ["kb_mcp.**.app", "kb_mcp.cli.commands"]
forbidden_modules = ["httpx"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Declaring the command imports none of the packages that runs need"
type = "forbidden"
source_modules = ["kb_mcp.cli.main", "kb_mcp.cli.options"]
forbidden_modules = [
  "httpx",
  "lxml",
  "mcp",
  "numpy",
  "opentelemetry",
  "platformdirs",
  "playwright",
  "pydantic",
  "pydantic_core",
  "pydantic_settings",
  "requests",
  "rich",
  "structlog",
  "yaml",
]

[[tool.importlinter.contracts]]
name = "Only observability and the command use Rich and requests, never progress"
type = "forbidden"
source_modules = [
  "kb_mcp.observability.adapters.progress",
  "kb_mcp.evaluation",
  "kb_mcp.mcp",
  "kb_mcp.search",
  "kb_mcp.mirror",
  "kb_mcp.sources",
  "kb_mcp.config",
  "kb_mcp.kernel",
]
forbidden_modules = ["requests", "rich"]
