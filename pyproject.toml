[project]
name = "atlassian-offline-mcp"
version = "0.1.0"
description = "An offline mirror of Confluence and Jira Cloud, served to coding agents over MCP."
readme = "README.md"
requires-python = ">=3.14"
# Declared together for plans 004 to 006, so that their parallel branches never
# conflict over this file or the lock.
dependencies = [
  "argcomplete>=3.7,<4",
  "certifi>=2024.2",
  "httpx>=0.28,<1",
  "lxml>=6,<7",
  "mcp>=2.3,<3",
  "numpy>=2.3,<3",
  "pillow>=13,<14",
  "playwright>=1.64,<2",
  "pydantic>=2.14,<3",
  "pyyaml>=6,<7",
  "truststore>=0.10,<1",
]

[project.scripts]
atlassian-offline-mcp = "atlassian_offline_mcp.cli.main:main"

[dependency-groups]
dev = [
  "import-linter>=2.15,<3",
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]

[tool.importlinter]
root_package = "atlassian_offline_mcp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contexts use those below them, never those above"
type = "layers"
containers = ["atlassian_offline_mcp"]
layers = ["cli", "evaluation", "mcp", "search", "mirror", "sources", "config", "kernel"]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
name = "Within each context: entry, commands, options, use cases, effects, pure rules"
type = "layers"
containers = [
  "atlassian_offline_mcp.cli",
  "atlassian_offline_mcp.evaluation",
  "atlassian_offline_mcp.mcp",
  "atlassian_offline_mcp.search",
  "atlassian_offline_mcp.mirror",
  "atlassian_offline_mcp.sources.*",
  "atlassian_offline_mcp.config",
]
layers = ["(main)", "(commands)", "(options)", "(app)", "(adapters)", "(domain)"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Pure rules, in any context, use no effect and no use case"
type = "forbidden"
source_modules = ["atlassian_offline_mcp.kernel", "atlassian_offline_mcp.**.domain"]
forbidden_modules = ["atlassian_offline_mcp.**.adapters", "atlassian_offline_mcp.**.app"]

[[tool.importlinter.contracts]]
name = "Effects, in any context, use no use case"
type = "forbidden"
source_modules = ["atlassian_offline_mcp.**.adapters"]
forbidden_modules = ["atlassian_offline_mcp.**.app"]

[[tool.importlinter.contracts]]
name = "Search, the server and the evaluation read the mirror, never a source"
type = "forbidden"
source_modules = [
  "atlassian_offline_mcp.search",
  "atlassian_offline_mcp.mcp",
  "atlassian_offline_mcp.evaluation",
  "atlassian_offline_mcp.cli.commands.serve",
  "atlassian_offline_mcp.cli.commands.index",
  "atlassian_offline_mcp.cli.commands.evaluate",
  "atlassian_offline_mcp.cli.commands.model",
]
forbidden_modules = ["atlassian_offline_mcp.sources"]

[[tool.importlinter.contracts]]
name = "Use cases and commands reach the network through effects only"
type = "forbidden"
source_modules = ["atlassian_offline_mcp.**.app", "atlassian_offline_mcp.cli.commands"]
forbidden_modules = ["httpx"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Declaring the command imports none of the packages that runs need"
type = "forbidden"
source_modules = ["atlassian_offline_mcp.cli.main", "atlassian_offline_mcp.cli.options"]
forbidden_modules = [
  "httpx",
  "lxml",
  "mcp",
  "numpy",
  "opentelemetry",
  "platformdirs",
  "playwright",
  "pydantic",
  "pydantic_core",
  "pydantic_settings",
  "rich",
  "structlog",
  "yaml",
]
