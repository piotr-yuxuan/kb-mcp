name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # The mirror's tests run pandoc.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - if: runner.os == 'macOS'
        run: brew install pandoc
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run lint-imports
      - run: uv run pytest -n auto
