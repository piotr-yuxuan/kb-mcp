# Grafana's LGTM image, for this program's telemetry on this machine only, with podman or
# Docker alike:
#
#   podman compose -f deploy/lgtm/compose.yaml up -d
#
# then telemetry.endpoint at http://127.0.0.1:4318, and Grafana at http://127.0.0.1:3000.
# No volume: `down` discards what the container received.
services:
  lgtm:
    # 0.37.0, of 2026-10-16, by its digest; the registry is written out for podman.
    image: docker.io/grafana/otel-lgtm:0.37.0@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07
    ports:
      - "127.0.0.1:3000:3000" # Grafana
      - "127.0.0.1:4318:4318" # OTLP over HTTP
    environment:
      # Anonymous users are Admin: Grafana turns away any other host name, against DNS
      # rebinding.
      GF_SERVER_DOMAIN: "127.0.0.1"
      GF_SERVER_ENFORCE_DOMAIN: "true"
      # Nothing calls home. The image adds grafana-llm-app to any list of plugins to
      # preinstall, so none is, at the cost of the drilldown apps.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      LOKI_EXTRA_ARGS: "-reporting.enabled=false"
      TEMPO_EXTRA_ARGS: "-reporting.enabled=false"
      PYROSCOPE_EXTRA_ARGS: "-usage-stats.enabled=false"
    volumes:
      # The dashboards' provider, and their folder whole, so that a new one needs no line.
      - ./dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/atlassian-offline-mcp.yaml:ro
      - ./dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/atlassian-offline-mcp:ro
