line-length = 100
target-version = "py314"
# The spikes and the sandbox seeding are standalone scripts that declare Python 3.12
# inline; they stay as they were written.
per-file-target-version = { "spikes/**" = "py312", "sandbox/**" = "py312" }

[lint]
select = ["ALL"]
# Rules that conflict with the formatter, as in the user's own configuration.
ignore = ["COM812", "COM819", "D203", "D206", "D213", "D300", "E111", "E114", "E117",
          "Q000", "Q001", "Q002", "Q003", "Q004", "W191",
          # No licence is chosen yet; revisit copyright notices before publishing.
          "CPY001"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# pytest checks with assert.
"**/test_*.py" = ["S101"]
