line-length = 100
target-version = "py314"
# The spikes and the sandbox seeding are standalone scripts that declare Python 3.12
# inline; they stay as they were written. The release script runs on the runner's own
# Python 3.12.
per-file-target-version = { "spikes/**" = "py312", "sandbox/**" = "py312", "scripts/**" = "py312" }

[lint]
select = ["ALL"]
# Rules that conflict with the formatter, as in the user's own configuration.
ignore = ["COM812", "COM819", "D203", "D206", "D213", "D300", "E111", "E114", "E117",
          "Q000", "Q001", "Q002", "Q003", "Q004", "W191",
          # No licence is chosen yet; revisit copyright notices before publishing.
          "CPY001"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
# pytest checks with assert.
"**/test_*.py" = ["S101"]

[lint.flake8-type-checking]
# Pydantic reads a record's annotations when its class is made: the types they name are
# imported at run time. Ruff follows a subclass of a subclass within one module alone, so
# a record subclassed in another module is named too: the tests' Counting is a Pandoc,
# a source's row an Outcome.
runtime-evaluated-base-classes = [
  "kb_mcp.kernel.record.Record",
  "kb_mcp.mirror.adapters.pandoc.Pandoc",
  "kb_mcp.kernel.outcome.Outcome",
]
